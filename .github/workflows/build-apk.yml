@Composable
private fun ColumnScope.EditionsPage(
    editions: List<Edition>,
    accent: Color,
    onCreate: () -> Unit
) {
    Column(
        modifier = Modifier
            .fillMaxWidth()
            .weight(1f)
    ) {
        Row(
            modifier = Modifier
                .fillMaxWidth()
                .padding(horizontal = 18.dp, vertical = 6.dp),
            verticalAlignment = Alignment.CenterVertically,
            horizontalArrangement = Arrangement.SpaceBetween
        ) {
            Column {
                Text(
                    "My Editions",
                    fontSize = 28.sp,
                    fontWeight = FontWeight.Bold
                )

                Text(
                    "Seus álbuns, suas regras.",
                    color = SecondaryText,
                    fontSize = 12.sp
                )
            }

            FilledIconButton(
                onClick = onCreate,
                colors = IconButtonDefaults.filledIconButtonColors(
                    containerColor = accent
                )
            ) {
                Icon(
                    Icons.Filled.Add,
                    contentDescription = "Criar edição",
                    tint = Color.Black
                )
            }
        }

        if (editions.isEmpty()) {
            Box(
                modifier = Modifier.fillMaxSize(),
                contentAlignment = Alignment.Center
            ) {
                Text(
                    "Suas edições aparecerão aqui.",
                    color = SecondaryText
                )
            }
        } else {
            LazyColumn(
                contentPadding = PaddingValues(18.dp),
                verticalArrangement = Arrangement.spacedBy(11.dp)
            ) {
                items(
                    items = editions,
                    key = { edition -> edition.id }
                ) { edition ->
                    EditionCard(edition, accent)
                }
            }
        }
    }
}

