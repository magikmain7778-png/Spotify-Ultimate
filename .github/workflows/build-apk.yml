                        Icons.Filled.Album,
                        Modifier.weight(1f)
                    )
                }
            }
        }

        item {
            Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                SectionTitle("Álbuns para revisitar")

                Row(
                    modifier = Modifier.horizontalScroll(rememberScrollState()),
                    horizontalArrangement = Arrangement.spacedBy(13.dp)
                ) {
                    AlbumCard(
                        "Currents",
                        "Tame Impala",
                        Color(0xFF9A542D),
                        Color(0xFFE2A36A)
                    )

                    AlbumCard(
                        "Blonde",
                        "Frank Ocean",
                        Color(0xFF8D795E),
                        Color(0xFFE0C9A4)
                    )

                    AlbumCard(
                        "DONDA",
                        "Kanye West",
                        Color(0xFF242424),
                        Color(0xFF777777)
                    )

                    AlbumCard(
                        "IGOR",
                        "Tyler, The Creator",
                        Color(0xFF6E7B55),
                        Color(0xFFD3D9A7)
                    )
                }
            }
        }

        item {
            Surface(
                color = SurfaceDark,
                shape = RoundedCornerShape(18.dp),
                modifier = Modifier.fillMaxWidth()
            ) {
                Column(
                    modifier = Modifier.padding(17.dp),
                    verticalArrangement = Arrangement.spacedBy(7.dp)
                ) {
                    Text(
                        "Uma nova experiência",
                        color = Color.White,
                        fontWeight = FontWeight.Bold,
