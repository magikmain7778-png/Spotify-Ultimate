                    )

                    Text(
                        "Integração Spotify: próxima etapa",
                        color = accent,
                        fontSize = 11.sp,
                        fontWeight = FontWeight.SemiBold
                    )
                }
            }
        }
    }
}

@Composable
private fun ColumnScope.SearchPage(
    query: String,
    onQueryChange: (String) -> Unit
) {
    Column(
        modifier = Modifier
            .fillMaxWidth()
            .weight(1f)
            .padding(horizontal = 18.dp, vertical = 8.dp),
        verticalArrangement = Arrangement.spacedBy(15.dp)
    ) {
        Text(
            "Buscar",
            fontSize = 29.sp,
            fontWeight = FontWeight.Bold
        )

        OutlinedTextField(
            value = query,
            onValueChange = onQueryChange,
            modifier = Modifier.fillMaxWidth(),
            placeholder = {
                Text("Artistas, músicas, álbuns...")
            },
            leadingIcon = {
                Icon(Icons.Filled.Search, contentDescription = null)
            },
            trailingIcon = {
                if (query.isNotEmpty()) {
                    IconButton(onClick = { onQueryChange("") }) {
                        Icon(
                            Icons.Filled.Close,
                            contentDescription = "Limpar busca"
                        )
                    }
                }
            },
            singleLine = true,
            shape = RoundedCornerShape(15.dp),
            colors = OutlinedTextFieldDefaults.colors(
                focusedBorderColor = Color.White,
                unfocusedBorderColor = SurfaceLight,
                focusedContainerColor = SurfaceDark,
                unfocusedContainerColor = SurfaceDark
            )
        )

        if (query.isBlank()) {
            Text(
                "Explore sua música",
                color = SecondaryText,
                fontSize = 13.sp
            )

            Text(
                "A busca real será ativada com a integração oficial do Spotify.",
                color = SecondaryText,
                fontSize = 12.sp
            )
        } else {
            Text(
                "Busca preparada: \"$query\"",
                color = Color.White,
                fontSize = 14.sp
            )

            Text(
                "Os resultados reais dependem da conexão autorizada com o Spotify.",
                color = SecondaryText,
                fontSize = 12.sp
            )
        }
    }
}

