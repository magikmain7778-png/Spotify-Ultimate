private val Green = Color(0xFF1ED760)
private val Background = Color(0xFF080A0B)
private val SurfaceDark = Color(0xFF171A1C)
private val SurfaceLight = Color(0xFF25292B)
private val SecondaryText = Color(0xFF9DA4A8)

private enum class AppTab(val title: String) {
    HOME("Início"),
    SEARCH("Buscar"),
    LIBRARY("Biblioteca"),
    EDITIONS("My Editions")
}

private data class Edition(
    val id: Int,
    val title: String,
    val description: String,
    val tracks: Int
)

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            SpotifyUltimateApp()
        }
    }
}

@Composable
private fun SpotifyUltimateApp() {
    var selectedTab by remember { mutableStateOf(AppTab.HOME) }
    var appleLook by remember { mutableStateOf(true) }
    var searchText by remember { mutableStateOf("") }
    var isPlaying by remember { mutableStateOf(false) }
    var showCreateDialog by remember { mutableStateOf(false) }
    var nextId by remember { mutableIntStateOf(3) }

    var editions by remember {
        mutableStateOf(
            listOf(
                Edition(
                    1,
                    "DONDA — Personal Edition",
                    "Kanye West · Edição personalizada",
                    27
                ),
                Edition(
                    2,
                    "Blonde — Late Night Cut",
                    "Frank Ocean · Edição personalizada",
                    12
                )
            )
        )
    }

    val accent = if (appleLook) Color(0xFFF1F1F1) else Green

    MaterialTheme(
        colorScheme = darkColorScheme(
            primary = accent,
            background = Background,
            surface = SurfaceDark,
            onPrimary = Color.Black,
            onBackground = Color.White,
            onSurface = Color.White
        )
    ) {
        Scaffold(
            containerColor = Background,
            bottomBar = {
                Column {
                    MiniPlayer(
                        isPlaying = isPlaying,
                        onPlayPause = { isPlaying = !isPlaying },
                        accent = accent
                    )

                    NavigationBar(
                        containerColor = Color(0xFF090B0C),
                        contentColor = SecondaryText,
                        tonalElevation = 0.dp
                    ) {
                        AppTab.values().forEach { tab ->
                            val icon = when (tab) {
                                AppTab.HOME -> Icons.Filled.Home
                                AppTab.SEARCH -> Icons.Filled.Search
                                AppTab.LIBRARY -> Icons.Filled.LibraryMusic
                                AppTab.EDITIONS -> Icons.Filled.Album
                            }

                            NavigationBarItem(
                                selected = selectedTab == tab,
                                onClick = { selectedTab = tab },
                                icon = {
                                    Icon(icon, contentDescription = tab.title)
                                },
                                label = {
                                    Text(tab.title, fontSize = 10.sp, maxLines = 1)
                                },
                                colors = NavigationBarItemDefaults.colors(
                                    selectedIconColor = accent,
                                    selectedTextColor = Color.White,
                                    unselectedIconColor = SecondaryText,
                                    unselectedTextColor = SecondaryText,
                                    indicatorColor = SurfaceLight
                                )
                            )
                        }
                    }
                }
            }
        ) { innerPadding ->

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(innerPadding)
                    .background(Background)
            ) {
                Header(
                    appleLook = appleLook,
                    accent = accent,
                    onToggleStyle = { appleLook = !appleLook }
                )

                when (selectedTab) {
                    AppTab.HOME -> HomePage(accent)

                    AppTab.SEARCH -> SearchPage(
                        query = searchText,
                        onQueryChange = { searchText = it }
                    )

                    AppTab.LIBRARY -> LibraryPage()

                    AppTab.EDITIONS -> EditionsPage(
                        editions = editions,
                        accent = accent,
                        onCreate = { showCreateDialog = true }
                    )
                }
            }
        }

        if (showCreateDialog) {
            var title by remember { mutableStateOf("") }

            AlertDialog(
                onDismissRequest = { showCreateDialog = false },
                title = {
                    Text("Nova edição", fontWeight = FontWeight.Bold)
                },
                text = {
                    OutlinedTextField(
                        value = title,
                        onValueChange = { title = it },
                        label = { Text("Nome da edição") },
                        singleLine = true
                    )
                },
                confirmButton = {
                    TextButton(
                        onClick = {
                            if (title.isNotBlank()) {
                                editions = listOf(
                                    Edition(
                                        nextId,
                                        title.trim(),
                                        "Sua coleção personalizada",
                                        0
                                    )
                                ) + editions

                                nextId++
                            }

                            showCreateDialog = false
                        }
                    ) {
                        Text("Criar")
                    }
                },
                dismissButton = {
                    TextButton(
                        onClick = { showCreateDialog = false }
                    ) {
                        Text("Cancelar")
                    }
                },
                containerColor = SurfaceDark
            )
        }
    }
}

@Composable
private fun Header(
    appleLook: Boolean,
    accent: Color,
    onToggleStyle: () -> Unit
) {
    Row(
        modifier = Modifier
            .fillMaxWidth()
            .padding(
                start = 20.dp,
                end = 16.dp,
                top = 14.dp,
                bottom = 12.dp
            ),
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.SpaceBetween
    ) {
        Column {
            Text(
                "SPOTIFY ULTIMATE",
                color = accent,
                fontSize = 11.sp,
                fontWeight = FontWeight.ExtraBold,
                letterSpacing = 1.8.sp
            )

            Text(
                if (appleLook) "Music, reimagined."
                else "Sua música, do seu jeito.",
                color = SecondaryText,
                fontSize = 12.sp
            )
        }

        Surface(
            color = SurfaceLight,
            shape = CircleShape,
            modifier = Modifier.clickable(onClick = onToggleStyle)
        ) {
            Row(
                modifier = Modifier.padding(
                    horizontal = 13.dp,
                    vertical = 9.dp
                ),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Icon(
                    Icons.Filled.Palette,
                    contentDescription = null,
                    tint = accent,
                    modifier = Modifier.size(15.dp)
                )

                Spacer(Modifier.width(6.dp))

                Text(
                    if (appleLook) "Liquid" else "Spotify",
                    fontSize = 11.sp,
                    color = Color.White
                )
            }
        }
    }
}

