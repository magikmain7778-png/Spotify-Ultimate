
name: Extract Spotify Ultimate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Extract project
        run: |
          mkdir temp
          unzip Spotify-Ultimate-v0.1.0.zip -d temp
          cp -R temp/SpotifyUltimate/. .
          rm -rf temp
          rm Spotify-Ultimate-v0.1.0.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Spotify Ultimate project" || echo "No changes"
          git push
